name: seville
description: Seville's native Flutter knowledge graph client.
publish_to: none
version: 3.3.5+27

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  fixnum: ^1.1.1
  flutter_riverpod: ^3.0.0
  seville_proto:
    path: ../../proto/gen/dart

dev_dependencies:
  flutter_lints: ^6.0.0
  rename_app: ^1.6.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

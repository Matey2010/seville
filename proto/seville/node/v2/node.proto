syntax = "proto3";

package seville.node.v2;

option go_package = "github.com/Matey2010/seville/proto/gen/go/seville/node/v2;nodev2";

import "google/protobuf/timestamp.proto";

message NodeSnapshot {
  string revision = 1;
  google.protobuf.Timestamp generated_at = 2;
  repeated Node nodes = 3;
  repeated NodeConnection connections = 4;
  repeated ImportWarning warnings = 5;
}

message Node {
  reserved 1, 5;
  reserved "id", "tags";
  string path = 2;
  string title = 3;
  string body = 4;
  map<string, string> frontmatter = 6;
  google.protobuf.Timestamp modified_at = 7;
  repeated Emoji emojis = 8;
  repeated string labels = 9;
  string slug = 10;
  uint64 update_count = 11;
  NodeTemporalSpan temporal_span = 12;
}

// Calendar interval [start_date, end_date_exclusive), stored as native Neo4j DATE values.
message NodeTemporalSpan {
  string start_date = 1;
  string end_date_exclusive = 2;
  TemporalGranularity granularity = 3;
}

enum TemporalGranularity {
  TEMPORAL_GRANULARITY_UNSPECIFIED = 0;
  TEMPORAL_GRANULARITY_YEAR = 1;
  TEMPORAL_GRANULARITY_SEASON = 2;
  TEMPORAL_GRANULARITY_MONTH = 3;
  TEMPORAL_GRANULARITY_WEEK = 4;
  TEMPORAL_GRANULARITY_DAY = 5;
  TEMPORAL_GRANULARITY_RANGE = 6;
}

message Emoji {
  string id = 1;
  string character = 2;
  string title = 3;
  string codes = 4;
  string group_name = 5;
  string subgroup = 6;
  string category = 7;
  string source = 8;
  uint64 counter = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message NodeConnection {
  string source_node_slug = 1;
  string target_text = 2;
  optional string target_node_slug = 3;
  optional string display_text = 4;
  NodeConnectionKind kind = 5;
  optional string fragment = 6;
}

enum NodeConnectionKind {
  NODE_CONNECTION_KIND_UNSPECIFIED = 0;
  NODE_CONNECTION_KIND_WIKI = 1;
  NODE_CONNECTION_KIND_MARKDOWN = 2;
  NODE_CONNECTION_KIND_EMBED = 3;
}

message ImportWarning {
  string path = 1;
  string message = 2;
}

message ImportStatus {
  string revision = 1;
  google.protobuf.Timestamp imported_at = 2;
  uint32 node_count = 3;
  uint32 connection_count = 4;
  uint32 warning_count = 5;
}

message ApiError {
  string code = 1;
  string message = 2;
}

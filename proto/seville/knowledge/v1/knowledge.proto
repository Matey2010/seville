syntax = "proto3";

package seville.knowledge.v1;

option go_package = "github.com/Matey2010/seville/proto/gen/go/seville/knowledge/v1;knowledgev1";

import "google/protobuf/timestamp.proto";

message KnowledgeSnapshot {
  string revision = 1;
  google.protobuf.Timestamp generated_at = 2;
  repeated Note notes = 3;
  repeated Link links = 4;
  repeated ScanWarning warnings = 5;
}

message Note {
  string id = 1;
  string path = 2;
  string title = 3;
  string body = 4;
  repeated string tags = 5;
  map<string, string> frontmatter = 6;
  google.protobuf.Timestamp modified_at = 7;
}

message Link {
  string source_note_id = 1;
  string target_text = 2;
  optional string resolved_target_id = 3;
  optional string display_text = 4;
  LinkKind kind = 5;
  optional string fragment = 6;
}

enum LinkKind {
  LINK_KIND_UNSPECIFIED = 0;
  LINK_KIND_WIKI = 1;
  LINK_KIND_MARKDOWN = 2;
  LINK_KIND_EMBED = 3;
}

message ScanWarning {
  string path = 1;
  string message = 2;
}

message ScanStatus {
  string revision = 1;
  google.protobuf.Timestamp scanned_at = 2;
  uint32 note_count = 3;
  uint32 link_count = 4;
  uint32 warning_count = 5;
}

message ApiError {
  string code = 1;
  string message = 2;
}
